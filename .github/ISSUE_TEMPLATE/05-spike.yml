name: Spike
description: Investigación acotada en tiempo para reducir incertidumbre antes de comprometer trabajo.
title: "[Spike] "
labels: ["spike"]
body:
  - type: textarea
    id: pregunta
    attributes:
      label: Pregunta a responder
      description: Una sola pregunta concreta. Si hay varias, abre varios spikes.
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "Ej.: 2 días"
    validations:
      required: true
  - type: textarea
    id: salida
    attributes:
      label: Salida esperada
      description: "Ej.: ADR propuesto, prueba de concepto, recomendación con pros y contras."
    validations:
      required: true
  - type: textarea
    id: bloquea
    attributes:
      label: Qué historias o decisiones desbloquea
